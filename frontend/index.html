<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luxe Steps | Elevated Motion</title>
    
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;800&family=Syne:wght@500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Styles -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar" id="navbar">
        <div class="logo">LUXE STEPS</div>
        <div class="links">
            <a href="#hero">Home</a>
            <a href="#shop">Shop</a>
        </div>
        <div class="nav-icons">
            <i class="fas fa-shopping-cart"></i>
        </div>
    </nav>

    <!-- Hero Section -->
    <section class="hero-section" id="hero">
        <div class="glow"></div>
        <div class="hero-content">
            <h1 class="hero-title" id="title">ELEVATED<br>MOTION</h1>
            <p class="hero-subtitle" id="subtitle">Premium footwear for the modern era.</p>
            <button class="btn-luxury" onclick="location.href='#shop'">Discover Collection</button>
        </div>
        <img src="shoe.png" id="shoe" alt="Premium Sneaker" class="floating-shoe">
    </section>

    <!-- MongoDB Product List Section -->
    <section class="products-section" id="shop">
        <h2 class="section-title text-center">New Arrivals</h2>
        <!-- This is where the JS will inject your MongoDB items -->
        <div class="product-grid" id="product-list">
            <!-- Loading state -->
            <p style="text-align:center; width:100%; color:#666;">Loading premium collection...</p>
        </div>
    </section>

    <!-- Dependencies -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="js/api.js"></script>
    
    <script>
        // Injecting the API Data
        async function loadProducts() {
            const container = document.getElementById('product-list');
            const res = await api.fetch('/products');
            
            if (res.data && res.data.length > 0) {
                container.innerHTML = res.data.map(p => `
                    <div class="card">
                        <img src="${p.image || 'shoe.png'}" alt="${p.name}">
                        <h3>${p.name}</h3>
                        <p>$${p.price.toFixed(2)}</p>
                        <button class="btn-luxury-small add-to-cart" 
                                data-id="${p._id}" 
                                data-name="${p.name}" 
                                data-price="${p.price}">
                                Add to Cart
                        </button>
                    </div>
                `).join('');

                // Add Cart Click Listeners
                document.querySelectorAll('.add-to-cart').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const product = e.target.dataset;
                        console.log("Added to cart:", product);
                        alert(product.name + " added to your collection.");
                    });
                });
            } else {
                container.innerHTML = "<p style='text-align:center;'>No products found.</p>";
            }
        }

        // Initialize
        loadProducts();

        // Basic Hero Animation
        gsap.from("#title", { duration: 1.5, y: 100, opacity: 0, ease: "power4.out" });
    </script>
</body>
</html>
